name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: icbm
            asset_name: icbm-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: icbm
            asset_name: icbm-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: icbm
            asset_name: icbm-macos-aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # No native dependencies needed; binary links only against
            # system frameworks.
            true
          fi
        shell: bash

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Run smoke test
        run: |
          target/${{ matrix.target }}/release/${{ matrix.artifact_name }} host-info
        shell: bash

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          cd artifacts
          for d in */; do
            d=${d%/}
            if [ -f "$d/icbm.exe" ]; then
              mv "$d/icbm.exe" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            elif [ -f "$d/icbm" ]; then
              mv "$d/icbm" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            fi
          done

      - name: Generate Release Body
        shell: bash
        run: |
          echo "Automated build of commit ${{ github.sha }}" > release_body.txt
          echo "" >> release_body.txt
          echo "\`\`\`" >> release_body.txt
          git log -1 --pretty=%B >> release_body.txt
          echo "\`\`\`" >> release_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          body_path: release_body.txt
          files: |
            artifacts/icbm-*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
