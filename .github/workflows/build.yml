name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: icbm
            asset_name: icbm-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: icbm
            asset_name: icbm-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: icbm
            asset_name: icbm-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: icbm.exe
            asset_name: icbm-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config lld mold qemu-kvm libvirt-daemon-system virtinst
            if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
              sudo dpkg --add-architecture arm64
              # For Ubuntu 24.04 (noble) which uses deb822 format
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
                printf "Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates noble-security\nComponents: main restricted universe multiverse\nArchitectures: arm64\n" | sudo tee /etc/apt/sources.list.d/arm64.sources
              else
                # For older Ubuntu versions
                sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
              fi
              sudo apt-get update
              sudo apt-get install -y libssl-dev:arm64
            fi
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install openssl pkg-config qemu libvirt
          fi
        shell: bash

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_DIR_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          else
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Run benchmark
        continue-on-error: true
        run: |
          echo "Starting benchmark at $(date)" > benchmark-output-${{ matrix.asset_name }}.txt
          echo "Binary: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
          if target/${{ matrix.target }}/release/${{ matrix.artifact_name }} >> benchmark-output-${{ matrix.asset_name }}.txt 2>&1; then
            echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
            echo "Benchmark completed successfully at $(date)" >> benchmark-output-${{ matrix.asset_name }}.txt
          else
            EXIT_CODE=$?
            echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
            echo "Benchmark failed with exit code: $EXIT_CODE at $(date)" >> benchmark-output-${{ matrix.asset_name }}.txt
          fi
        shell: bash

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output-${{ matrix.asset_name }}
          path: benchmark-output-${{ matrix.asset_name }}.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          cd artifacts
          for d in */; do
            d=${d%/}
            # skip benchmark output dirs
            if [[ "$d" == benchmark-output-* ]]; then
              continue
            fi
            if [ -f "$d/icbm.exe" ]; then
              mv "$d/icbm.exe" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            elif [ -f "$d/icbm" ]; then
              mv "$d/icbm" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: main-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          files: |
            artifacts/icbm-*
            artifacts/benchmark-output-*/*.txt
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

