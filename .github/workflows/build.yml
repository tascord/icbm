name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: icbm
            asset_name: icbm-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: icbm
            asset_name: icbm-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: icbm
            asset_name: icbm-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: icbm.exe
            asset_name: icbm-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config lld mold qemu-kvm libvirt-daemon-system virtinst cloud-image-utils qemu-user-static binfmt-support
            sudo systemctl start libvirtd || true
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install openssl pkg-config qemu libvirt
            brew services start libvirt || true
          fi
        shell: bash

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Run benchmark
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        continue-on-error: true
        run: |
          BENCH_PROVIDER="libvirt"
          echo "Starting benchmark at $(date)" > benchmark-output-${{ matrix.asset_name }}.txt
          echo "Binary: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "Provider: ${BENCH_PROVIDER}" >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "ICBM_STATE_DIR: ${RUNNER_TEMP}/icbm" >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
          if ICBM_STATE_DIR="${RUNNER_TEMP}/icbm" target/${{ matrix.target }}/release/${{ matrix.artifact_name }} run --provider "$BENCH_PROVIDER" >> benchmark-output-${{ matrix.asset_name }}.txt 2>&1; then
            echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
            echo "Benchmark completed successfully at $(date)" >> benchmark-output-${{ matrix.asset_name }}.txt
          else
            EXIT_CODE=$?
            echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
            echo "Benchmark failed with exit code: $EXIT_CODE at $(date)" >> benchmark-output-${{ matrix.asset_name }}.txt
          fi
        shell: bash

      - name: Mark benchmark as skipped on unsupported runners
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          echo "Starting benchmark at $(date)" > benchmark-output-${{ matrix.asset_name }}.txt
          echo "Binary: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "---" >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "Benchmark skipped in CI for this target." >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "Reason: provider tooling unavailable on GitHub-hosted runner (utmctl on macOS, virsh/libvirt on Windows)." >> benchmark-output-${{ matrix.asset_name }}.txt
          echo "Run on a self-hosted machine with provider tools installed to benchmark this target." >> benchmark-output-${{ matrix.asset_name }}.txt
        shell: bash

      - name: Upload benchmark output
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output-${{ matrix.asset_name }}
          path: benchmark-output-${{ matrix.asset_name }}.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          cd artifacts
          for d in */; do
            d=${d%/}
            # skip benchmark output dirs
            if [[ "$d" == benchmark-output-* ]]; then
              continue
            fi
            if [ -f "$d/icbm.exe" ]; then
              mv "$d/icbm.exe" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            elif [ -f "$d/icbm" ]; then
              mv "$d/icbm" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: main-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          files: |
            artifacts/icbm-*
            artifacts/benchmark-output-*/*.txt
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

