name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: icbm
            asset_name: icbm-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: icbm
            asset_name: icbm-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: icbm
            asset_name: icbm-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config lld mold qemu-kvm libvirt-daemon-system virtinst cloud-image-utils qemu-user-static binfmt-support
            sudo systemctl start libvirtd || true
            printf '<network>\n  <name>default</name>\n  <bridge name="virbr0"/>\n  <forward/>\n  <ip address="192.168.122.1" netmask="255.255.255.0">\n    <dhcp>\n      <range start="192.168.122.2" end="192.168.122.254"/>\n    </dhcp>\n  </ip>\n</network>\n' > default.xml
            sudo virsh --connect qemu:///system net-define default.xml || true
            sudo virsh --connect qemu:///system net-autostart default || true
            sudo virsh --connect qemu:///system net-start default || true
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install openssl pkg-config qemu libvirt virt-manager
            brew services start libvirt || true
          fi
        shell: bash

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Run benchmark
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        continue-on-error: true
        run: |
          BENCH_PROVIDER="libvirt"
          if [ "$RUNNER_OS" == "macOS" ]; then
            LIBVIRT_DEFAULT_URI="qemu:///session"
            SUDO_CMD=""
            export ICBM_VIRT_NETWORK="user"
            export ICBM_STATE_DIR="${RUNNER_TEMP}/icbm"
          else
            LIBVIRT_DEFAULT_URI="qemu:///system"
            SUDO_CMD="sudo --preserve-env=ICBM_STATE_DIR,LIBVIRT_DEFAULT_URI,ICBM_VIRT_NETWORK"
            export ICBM_VIRT_NETWORK="network=default"
            export ICBM_STATE_DIR="/tmp/icbm"
          fi
          
          # Initialize step summary for this runner
          echo "### Benchmark: ${{ matrix.asset_name }}" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          
          if ICBM_STATE_DIR="${ICBM_STATE_DIR}" LIBVIRT_DEFAULT_URI="${LIBVIRT_DEFAULT_URI}" ICBM_VIRT_NETWORK="${ICBM_VIRT_NETWORK}" $SUDO_CMD target/${{ matrix.target }}/release/${{ matrix.artifact_name }} run --provider "$BENCH_PROVIDER" 2>&1; then
            echo "| ${{ matrix.os }} | ${{ matrix.target }} | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            EXIT_CODE=$?
            echo "| ${{ matrix.os }} | ${{ matrix.target }} | ❌ Failed (Code: $EXIT_CODE) |" >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash


  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          cd artifacts
          for d in */; do
            d=${d%/}
            if [ -f "$d/icbm.exe" ]; then
              mv "$d/icbm.exe" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            elif [ -f "$d/icbm" ]; then
              mv "$d/icbm" "${d}.tmp"
              rm -rf "$d"
              mv "${d}.tmp" "$d"
            fi
          done

      - name: Generate Release Body
        shell: bash
        run: |
          echo "Automated build of commit ${{ github.sha }}" > release_body.txt
          echo "" >> release_body.txt
          echo "\`\`\`" >> release_body.txt
          git log -1 --pretty=%B >> release_body.txt
          echo "\`\`\`" >> release_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: main-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          body_path: release_body.txt
          files: |
            artifacts/icbm-*
            
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

